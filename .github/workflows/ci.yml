name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('backend/requirements.txt', 'requirements-dev.txt') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests
        env:
          LLM_MOCK: 'true'
          API_MOCK: 'true'
        run: python -m pytest tests/ -q --tb=short
      # R10.5: 暂时不传 coverage (codecov 没 token 会 fail), 等团队设了 CODECOV_TOKEN 再加

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        # R10.5 Fix-P0-Audit-1.3: 显式 CVE 白名单 (跟 SECURITY.md 同步).
        # 旧实现: `|| true` 静默吞所有 CVE, CI 永远绿, 安全问题不可见.
        # 新实现: --ignore-vuln 显式白名单已知但未升级的 CVE, 其它 CVE 真实
        # fail CI. 升级路径写在 SECURITY.md.
        #
        # 白名单:
        #   PYSEC-2024-38: langgraph 0.6.11, 升级到 1.0 是破坏性 API 变更 (R11+ 评估)
        #   GHSA-9hjg-9rjm-9j3p: langgraph-checkpoint 3.0.1, 跟 langgraph 同
        run: |
          pip-audit -r backend/requirements.txt \
            --ignore-vuln PYSEC-2024-38 \
            --ignore-vuln GHSA-9hjg-9rjm-9j3p

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Lint
        working-directory: frontend
        run: npm run lint || true  # 不强制 lint, 等团队规约

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t scholarflow-backend:test .
      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t scholarflow-frontend:test .
