server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到 backend 服务
    # R10.5 Fix-Audit-nginx: proxy_pass 末尾**不**带斜杠, 保留 /api 前缀
    # 透传到后端. 旧版末尾斜杠让 nginx 剥掉 /api/ location prefix,
    # /api/v1/search/stream → /v1/search/stream → 后端 404 (后端只注册 /api/v1/*).
    # 跟 R10.5 Fix-P2-4-Audit-diff 引入的 /api/v1 路由对齐: 路径原样透传.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE streaming 必须
        proxy_buffering off;
        proxy_cache off;
        # 长连接 (SSE 需要)
        # P0-5 fix (深度审计 §P0-5): 300s < 后端 480s, SSE 长时间搜索
        # 会被 nginx 在后端完成前强制断开, 前端收到 502, 后端空跑
        # 继续消耗 LLM token. 改为 ≥ 600s 留 25% 余量.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
