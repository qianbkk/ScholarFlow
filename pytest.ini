[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# tests/manual/ contains Playwright/real-frontend scripts that need
# a live backend + frontend dev server. They are run with `python tests/manual/...`
# directly, not via pytest.
norecursedirs = manual

# R10.5.40 (Agent 3): pytest-cov baseline invocation. Requires `pip install
# pytest-cov` (already declared in requirements-dev.txt; CI installs it). To
# run tests without coverage in a stripped-down env, pass `-o addopts=`:
#
#     python -m pytest -o addopts= tests/             # bare run, no coverage
#     python -m pytest --cov=backend --cov-report=term-missing tests/   # default
#
# (R10.5.51 cleanup: COVERAGE.md 已在 R10.5.41 删除, 删其悬挂引用, 见 BACKLOG.md D-004)
addopts = --cov=backend --cov-report=term-missing
